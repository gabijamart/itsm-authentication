{% extends 'accounts/base.html' %}

{% block title %}Set New Password{% endblock %}

{% block content %}
<h1>Set a new password</h1>

<p>
    Your backup code has been verified.
    Set a new password to recover your account.
</p>

<form method='post'>
    {% csrf_token %}
    {{ form.as_p }}

    <button type='submit'>
        Set new password
    </button>
</form>
{% endblock %}
