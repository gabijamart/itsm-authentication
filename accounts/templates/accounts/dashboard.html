<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <title>Dashboard</title>
</head>
<body>
    <h1>Welcome, {{ request.user.username }}!</h1>

    <p>You are successfully authenticated.</p>

    <p>Remaining backup codes: {{ remaining }}</p>

    <a href='{% url 'backup_codes_setup' %}'>
        Manage backup codes
    </a>

    <form method='post' action='{% url 'logout' %}'>
        {% csrf_token %}
        <button type='submit'>Logout</button>
    </form>
</body>
</html>
