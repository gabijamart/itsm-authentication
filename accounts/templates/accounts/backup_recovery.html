{% extends 'accounts/base.html' %}

{% block title %}Backup Recovery{% endblock %}

{% block content %}
<h1>Recover account</h1>

<p>
    Enter your username and one unused backup code.
    You will be asked to set a new password.
</p>

<form method='post'>
    {% csrf_token %}
    {{ form.as_p }}

    <button type='submit'>
        Continue
    </button>
</form>

<p>
    <a href='{% url 'login' %}'>
        Back to login
    </a>
</p>
{% endblock %}
