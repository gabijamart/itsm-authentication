{% extends 'accounts/base.html' %}

{% block title %}Change Password{% endblock %}

{% block content %}
<h1>Change password</h1>

<p>
    Enter your current password and choose a new one.
</p>

<form method='post'>
    {% csrf_token %}
    {{ form.as_p }}

    <button type='submit'>Change password</button>
</form>

<p>
    <a href='{% url 'dashboard' %}'>
        Back to dashboard
    </a>
</p>
{% endblock %}
